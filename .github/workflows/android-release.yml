name: Android Release

# ── Trigger ─────────────────────────────────────────────────────────────────
# • git tag v1.2.3  →  signed APK + öffentlicher GitHub-Release
# • "Run workflow"  →  signed APK als Artifact (kein Release)
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Versionsnummer (z.B. 1.0.1)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Version Code – ganzzahlig, größer als vorherige'
        required: true
        default: '1'

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-android:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Versioning ──────────────────────────────────────────────────────
      - name: Resolve version (git tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "VERSION_NAME=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(date +%s)"               >> "$GITHUB_ENV"

      - name: Resolve version (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "VERSION_NAME=${{ inputs.version_name }}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ inputs.version_code }}" >> "$GITHUB_ENV"

      # ── Toolchain ───────────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # ── Signing ─────────────────────────────────────────────────────────
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/kal-sync.jks"

      # ── Build ───────────────────────────────────────────────────────────
      - name: Publish signed Android APK
        run: |
          dotnet publish kal-sync.csproj \
            --framework net9.0-android \
            --configuration Release \
            -p:ApplicationDisplayVersion="${{ env.VERSION_NAME }}" \
            -p:ApplicationVersion="${{ env.VERSION_CODE }}" \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$GITHUB_WORKSPACE/kal-sync.jks" \
            -p:AndroidSigningKeyAlias="${{ secrets.KEYSTORE_ALIAS }}" \
            -p:AndroidSigningKeyPass="${{ secrets.KEYSTORE_KEY_PASSWORD }}" \
            -p:AndroidSigningStorePass="${{ secrets.KEYSTORE_STORE_PASSWORD }}"

      # ── Artifact (immer hochladen) ──────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kal-sync-${{ env.VERSION_NAME }}
          path: "**/*-Signed.apk"
          retention-days: 30

      # ── GitHub Release (nur bei git-Tags) ───────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "kal-sync v${{ env.VERSION_NAME }}"
          files: "**/*-Signed.apk"
          body: |
            ## kal-sync v${{ env.VERSION_NAME }}

            **Installation (Sideloading):**
            1. APK auf dem Handy herunterladen
            2. Einstellungen → Sicherheit → Unbekannte Quellen aktivieren
            3. APK antippen → Installieren
