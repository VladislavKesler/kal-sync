name: Windows Release

# ── Trigger ─────────────────────────────────────────────────────────────────
# • git tag v1.2.3  →  Velopack-Paket + öffentlicher GitHub-Release
# • "Run workflow"  →  Paket als Artifact (kein Release)
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versionsnummer (z. B. 1.0.7)'
        required: true
        default: '1.0.0'

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-windows:
    name: Build & Pack (Windows / Velopack)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # ── Versioning ──────────────────────────────────────────────────────
      - name: Resolve version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"

      - name: Resolve version from manual input
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"

      # ── Toolchain ───────────────────────────────────────────────────────
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Install Velopack CLI (vpk)
        run: dotnet tool install -g vpk

      # ── Publish ─────────────────────────────────────────────────────────
      - name: Publish Windows app (self-contained, win-x64)
        run: >
          dotnet publish kal-sync.csproj
          --framework net9.0-windows10.0.19041.0
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:ApplicationDisplayVersion="${{ env.VERSION }}"
          -p:ApplicationVersion="${{ env.VERSION }}"
          -o ./publish/win

      # ── Pack with Velopack ───────────────────────────────────────────────
      # Output: ./releases/
      #   kal-sync-Setup.exe          ← Erstinstallation für neue Nutzer
      #   kal-sync-{version}-full.nupkg ← In-App-Update-Paket
      #   RELEASES                    ← Manifest (wird von UpdateManager geprüft)
      - name: Pack with Velopack
        run: >
          vpk pack
          --packId "kal-sync"
          --packVersion "${{ env.VERSION }}"
          --packDir "./publish/win"
          --mainExe "kal-sync.exe"
          --outputDir "./releases"

      # ── Artifact (immer hochladen) ──────────────────────────────────────
      - name: Upload Velopack artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kal-sync-windows-${{ env.VERSION }}
          path: ./releases/
          retention-days: 30

      # ── GitHub Release (nur bei git-Tags) ───────────────────────────────
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "kal-sync v${{ env.VERSION }}"
          files: ./releases/*
          body: |
            ## kal-sync v${{ env.VERSION }}

            ### Windows-Update
            Die App prüft beim Start automatisch auf Updates und meldet sich,
            sobald eine neue Version bereit ist.

            **Erstinstallation Windows:**
            1. `kal-sync-Setup.exe` herunterladen und ausführen
            2. App startet nach der Installation automatisch
